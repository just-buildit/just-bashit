[project]
name    = "just-bashit"
version = "0.14.0"

# Only a tool this repo needs FETCHED belongs here, spelled as a SPEC
# just-runit resolves (`just-bashit:<name>`, an https URL). The scripts it
# ships are not: the Makefile runs install-deps.sh from source on purpose,
# and just-runit has no local-path SPEC, so a `src/...` path never resolved
# (#119). test/runit-install.bats installs this file to keep it that way.
[tools.setup-system]
source = "just-bashit:setup-system"

# System packages this repo needs to build and test itself — what `make
# install-deps` installs, and, since CI stopped repeating the list per
# container image, the only copy of it. CI now bootstraps just what
# `actions/checkout` needs (git, plus a trust store where absent) and then
# runs install-deps.sh against this file. The containers run as root with no
# sudo package: the script derives that rather than being told, which is what
# lets one list serve both CI and a workstation.
#
# ssh-keygen is here because without it three setup-system tests `skip`
# rather than fail, and a suite that quietly tests less than it appears to is
# how the ssh step shipped requiring the binary for work that never needed it.
# The package that carries it differs on every manager; each name below was
# checked by generating a key in that distro's image, not inferred.
#
# zsh is here for test/jbx-shell.bats: the POSIX `jbx` function is sourced
# into whatever shell the user has, and zsh is macOS's default (brew's base
# already has it) -- a shell absent from the image would be a scenario that
# silently never ran. msys2 is left out; the .bats skip an absent shell.
# fish is deliberately not: it cannot source POSIX sh, and a fish-default
# distro (CachyOS) is left for bash before jbx is ever run.
#
# gpg, age and script(1) are for test/secret.bats (#229): it runs every
# `just-runit secret` command against both backends with throwaway keys,
# and gets a real terminal from script. Under CI a missing one FAILS those
# tests rather than skipping them, so a leg cannot lose one in silence.
# script is util-linux's everywhere but macOS, which ships its own; the
# package that carries it differs per manager. MSYS2 has no msys age, so
# its native ucrt64 build is the one installed.
[dev.apt]
packages = [
    "ca-certificates",
    "make",
    "git",
    "bats",
    "curl",
    "openssh-client",
    "zsh",
    "gnupg",
    "age",
    "bsdextrautils",
]

[dev.pacman]
packages = [
    "git",
    "make",
    "diffutils",
    "bats",
    "curl",
    "openssh",
    "zsh",
    "gnupg",
    "age",
    "util-linux",
]

[dev.dnf]
packages = [
    "git",
    "make",
    "diffutils",
    "bats",
    "curl",
    "openssh-clients",
    "zsh",
    "gnupg2",
    "age",
    "util-linux-script",
]

[dev.zypper]
packages = [
    "git",
    "make",
    "diffutils",
    "bats",
    "curl",
    "openssh",
    "zsh",
    "gpg2",
    "age",
    "util-linux",
]

[dev.apk]
packages = [
    "bash",
    "git",
    "make",
    "bats",
    "coreutils",
    "curl",
    "diffutils",
    "openssh-keygen",
    "zsh",
    "gnupg",
    "age",
    "util-linux-misc",
]

# macOS ships ssh-keygen in the base system, so brew has nothing to add.
[dev.brew]
packages = ["bash", "coreutils", "diffutils", "bats-core", "gnupg", "age"]

[dev.msys2]
packages = [
    "git",
    "make",
    "diffutils",
    "curl",
    "openssh",
    "gnupg",
    "mingw-w64-ucrt-x86_64-age",
    "util-linux",
]
