[build-system]
requires = ["just-buildit"]
build-backend = "just_buildit"

[tool.just-buildit]
pure = true

[project]
name = "just-bashit"
version = "0.8.0"
description = "One curl. Any machine. Your shell. A bare box becomes a working dev machine in one command; every script runs straight from a URL."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Matthew T Hunter", email = "matthew.t.hunter@aero.org" },
]
keywords = ["bash", "shell", "scripting", "cli", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Other Scripting Engines",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]

[project.scripts]
jb     = "just_bashit._launcher:jb"
jbx    = "just_bashit._launcher:jbx"
jb-inspect = "just_bashit._launcher:jb_inspect"
jb-setup-system = "just_bashit._launcher:jb_setup_system"
jb-ssh-to-windows = "just_bashit._launcher:jb_ssh_to_windows"

[project.urls]
Homepage      = "https://just-buildit.github.io/just-bashit/"
Repository    = "https://github.com/just-buildit/just-bashit"
Documentation = "https://just-buildit.github.io/just-bashit/"
Changelog     = "https://github.com/just-buildit/just-bashit/blob/main/CHANGELOG.md"

[dependency-groups]
# WHICH tools, at WHAT versions; uv.lock pins them. The Makefile owns HOW they
# run, .pre-commit-config.yaml owns WHEN. mdformat's plugins live here rather
# than as pre-commit additional_dependencies, where they were unpinned and
# drifted while the config still read as pinned.
dev = [
    "pre-commit",
    "bump-my-version",
    "zensical>=0.0.29; python_version >= '3.10'",
    "mdformat>=1.0; python_version >= '3.10'",
    "mdformat-gfm; python_version >= '3.10'",
    "mdformat-gfm-alerts; python_version >= '3.10'",
    "mdformat-mkdocs; python_version >= '3.10'",
    "mdformat-frontmatter; python_version >= '3.10'",
]

[tool.bumpversion]
current_version = "0.8.0"
commit = true
tag = true
tag_name = "v{new_version}"
message = "chore: release v{new_version}"

# The version `jb version` prints. Missing from this list until 0.2.0, which is
# how it sat at 0.1.4 through two releases; `make version-check` gates it now.
[[tool.bumpversion.files]]
filename = "src/just_bashit/just-runit"
search = "_VERSION=\"{current_version}\""
replace = "_VERSION=\"{new_version}\""

# Renamed from jb.toml in the same change that renamed the file itself, but
# this entry was missed -- so `bump-version` died with FileNotFoundError and
# the release path stayed broken until the next release was attempted.
[[tool.bumpversion.files]]
filename = "bootstrap.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""
