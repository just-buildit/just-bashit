# The version `jb version` prints. Missing from this list until 0.2.0, which is
# how it sat at 0.1.4 through two releases; `make version-check` gates it now.
[[tool.bumpversion.files]]
filename = "src/just_bashit/just-runit"
search = "_VERSION=\"{current_version}\""
replace = "_VERSION=\"{new_version}\""

[[tool.bumpversion.files]]
filename = "jb.toml"
