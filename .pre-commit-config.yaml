repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt

  # Dispatches inward so the hook cannot format differently from `make format`.
  # Versions — mdformat and every plugin — come from pyproject.toml's dev group
  # via uv.lock, so there is no additional_dependencies list to drift.
  - repo: local
    hooks:
      - id: mdformat
        name: mdformat
        entry: make -s lint-mdformat
        language: system
        pass_filenames: false
        types: [markdown]

      # always_run, not types: [markdown] — what breaks this gate is adding a
      # script under src/just_bashit/, and that commit touches no markdown at
      # all. A markdown-scoped hook would have stayed silent for make-run.
      - id: docs-coverage
        name: docs-coverage
        entry: make -s docs-coverage
        language: system
        pass_filenames: false
        always_run: true
