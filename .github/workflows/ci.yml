name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Both triggers above are webhook-delivered, so when GitHub sheds webhooks
  # this repo goes completely dark — no run to read, and no way to ask for
  # one. During the 2026-08-06 Actions incident, deliveries were throttled to
  # ~15% and PR #21 sat with no checks for hours; `gh workflow run` answered
  # 422, because a workflow can only be dispatched if the trigger is present
  # on the DEFAULT branch. Adding it after the fact does not help the PR that
  # needs it, which is why it belongs here before the next outage.
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.distro }})
    runs-on: ubuntu-22.04
    # The suite takes ~1 minute. A job that runs longer is hung, not slow,
    # and without this it hangs for GitHub's 6-hour ceiling: a leaked
    # ssh-agent holding bats' output descriptor cost exactly that, four
    # jobs at a time, before anything went red.
    timeout-minutes: 20
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:latest
            primary: 'true'
          - distro: arch
            image: archlinux:latest
            primary: 'false'
          - distro: fedora
            image: fedora:latest
            primary: 'false'
          - distro: alpine
            image: alpine:latest
            primary: 'false'

    steps:
      # Only what `actions/checkout` itself needs — git, and a TLS trust store
      # on the images that ship none. The real dependency list is NOT repeated
      # here: it lives once in bootstrap.toml and is installed below, after
      # checkout. Keeping a second copy in this file is how the ssh-keygen
      # package drifted out of sync per distro in the first place.
      - name: Bootstrap checkout prerequisites (debian)
        if: matrix.distro == 'debian'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git

      - name: Bootstrap checkout prerequisites (arch)
        if: matrix.distro == 'arch'
        run: pacman -Sy --noconfirm --needed git

      - name: Bootstrap checkout prerequisites (fedora)
        if: matrix.distro == 'fedora'
        run: dnf install -y git

      # alpine has no bash until this step, so it is the one image whose
      # bootstrap must run under sh — and must install bash, since every step
      # after it (and install-deps.sh) is bash.
      - name: Bootstrap checkout prerequisites (alpine)
        if: matrix.distro == 'alpine'
        shell: sh
        run: apk add --update --no-cache bash git

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Every container above runs as root with no sudo package installed.
      # install-deps.sh derives that and omits the prefix, so one invocation
      # covers all four distros and the workstation case unchanged.
      - name: Install dependencies (bootstrap.toml)
        run: bash src/just_bashit/install-deps.sh --verbose

      - name: Run tests
        run: make test

      - name: Upload test report XML
        if: matrix.primary == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-report-xml
          path: test-results/*.xml

      - name: Upload release artifact
        if: matrix.primary == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: just-bashit
          path: just-bashit.tar.gz

  test-macos:
    name: test (macos)
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # The macOS image already ships git, so checkout needs no bootstrap and
      # the brew list comes straight from bootstrap.toml. The runner is an
      # unprivileged user with passwordless sudo, but brew is never prefixed
      # with it — Homebrew refuses to run as root.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies (bootstrap.toml)
        run: bash src/just_bashit/install-deps.sh --verbose

      - name: Export GNU utilities to PATH
        run: |
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: make test

  test-windows:
    name: test (windows/ucrt64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Checkout comes first here, unlike every other job: the package list
      # below is read out of the repo. The windows runner ships git and Git
      # Bash, so neither this step nor the next needs MSYS2 to exist yet.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # setup-msys2 takes its packages as an action input, which is evaluated
      # before any step of its own could read a file — so this is the one job
      # that cannot simply run install-deps.sh after checkout. Lifting the
      # list out of bootstrap.toml with this repo's own toml reader keeps it
      # single-sourced anyway; writing it a second time in YAML is what let
      # the other distro lists drift.
      - name: Read [dev.msys2] from bootstrap.toml
        id: deps
        shell: bash
        run: |
          source src/just_bashit/toml.sh
          pkgs=$(toml_get_packages dev msys2 <bootstrap.toml | tr '\n' ' ')
          [ -n "${pkgs% }" ] || { echo "no [dev.msys2] packages found" >&2; exit 1; }
          echo "packages=${pkgs% }" >> "$GITHUB_OUTPUT"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: ${{ steps.deps.outputs.packages }}

      - name: Run tests
        run: make test

  coverage:
    name: coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: kcov/kcov:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap checkout prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies (bootstrap.toml)
        run: bash src/just_bashit/install-deps.sh --verbose

      - name: Run tests with coverage
        run: make coverage

      - name: Generate coverage badge JSON
        run: |
          XML=$(find test-results/coverage -name cobertura.xml | head -1)
          RATE=$(grep -oP 'line-rate="\K[^"]+' "${XML}" | head -1)
          PCT=$(awk "BEGIN { printf \"%d\", ${RATE} * 100 }")
          if   [ "${PCT}" -ge 90 ]; then COLOR="brightgreen"
          elif [ "${PCT}" -ge 75 ]; then COLOR="green"
          elif [ "${PCT}" -ge 60 ]; then COLOR="yellowgreen"
          elif [ "${PCT}" -ge 40 ]; then COLOR="yellow"
          else COLOR="red"
          fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%d%%","color":"%s"}\n' \
            "${PCT}" "${COLOR}" > test-results/coverage/coverage-badge.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: test-results/coverage/

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      # The gate. Everything it runs — the standard.mk drift check, help and
      # ghost gates, shellcheck, shfmt, mdformat — is defined in the Makefile
      # and the hook config, so local and CI cannot disagree.
      - name: make lint
        run: make lint

      - name: shellcheck (SARIF → Code Scanning)
        run: |
          shellcheck --format=sarif src/just_bashit/*.sh > shellcheck.sarif || true
          python3 -c "import json; json.load(open('shellcheck.sarif'))" \
            2>/dev/null || printf '%s\n' \
            '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"shellcheck","rules":[]}},"results":[]}]}' \
            > shellcheck.sarif

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: shellcheck.sarif

  ci-passed:
    name: CI passed
    needs: [test, test-macos, test-windows, lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required job failed or was cancelled"; exit 1
          fi
          echo "All required jobs passed"

  deploy-docs:
    # `test` is here because this job DOWNLOADS test-report-xml, which the
    # primary test job uploads as its last step. Listing only coverage and
    # lint made that a race: the artifact was consumed from a job that was
    # not waited for, and it only ever worked because the test job happened
    # to finish first.
    #
    # It stopped happening to finish first when the container jobs began
    # installing from bootstrap.toml, which made them slower. deploy-docs
    # then started 70s before the upload and failed with "Artifact not found
    # for name: test-report-xml" -- on main only, since this job is skipped
    # on pull requests, so no PR could have caught it.
    needs: [test, coverage, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install zensical junit2html junitparser

      - run: zensical build --clean

      - name: Download test report XML
        uses: actions/download-artifact@v8
        with:
          name: test-report-xml
          path: test-report-xml

      - name: Generate test report HTML
        run: |
          python3 - <<'PYEOF'
          import glob
          from junitparser import JUnitXml
          xml = JUnitXml()
          for f in sorted(glob.glob('test-report-xml/*.xml')):
              xml += JUnitXml.fromfile(f)
          xml.write('test-report-xml/merged.xml')
          PYEOF
          mkdir -p site/test-report
          junit2html test-report-xml/merged.xml site/test-report/index.html

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: site/coverage

      - name: Move badge JSON to site root
        run: mv site/coverage/coverage-badge.json site/coverage-badge.json || true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deployment
