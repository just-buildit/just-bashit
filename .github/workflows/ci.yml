name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Both triggers above are webhook-delivered, so when GitHub sheds webhooks
  # this repo goes completely dark — no run to read, and no way to ask for
  # one. During the 2026-08-06 Actions incident, deliveries were throttled to
  # ~15% and PR #21 sat with no checks for hours; `gh workflow run` answered
  # 422, because a workflow can only be dispatched if the trigger is present
  # on the DEFAULT branch. Adding it after the fact does not help the PR that
  # needs it, which is why it belongs here before the next outage.
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.distro }})
    runs-on: ubuntu-22.04
    # The suite takes ~1 minute. A job that runs longer is hung, not slow,
    # and without this it hangs for GitHub's 6-hour ceiling: a leaked
    # ssh-agent holding bats' output descriptor cost exactly that, four
    # jobs at a time, before anything went red.
    timeout-minutes: 20
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:latest
            primary: 'true'
          - distro: arch
            image: archlinux:latest
            primary: 'false'
          - distro: fedora
            image: fedora:latest
            primary: 'false'
          - distro: alpine
            image: alpine:latest
            primary: 'false'

    steps:
      - name: Install dependencies (debian)
        if: matrix.distro == 'debian'
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            ca-certificates make git bats curl openssh-client

      - name: Install dependencies (arch)
        if: matrix.distro == 'arch'
        run: pacman -Sy --noconfirm --needed git make diffutils bats curl openssh

      - name: Install dependencies (fedora)
        if: matrix.distro == 'fedora'
        run: dnf install -y git make diffutils bats curl openssh-clients

      - name: Install dependencies (alpine)
        if: matrix.distro == 'alpine'
        shell: sh
        run: |
          apk add --update --no-cache \
            bash git make bats coreutils curl diffutils openssh-keygen

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run tests
        run: make test

      - name: Upload test report XML
        if: matrix.primary == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-report-xml
          path: test-results/*.xml

      - name: Upload release artifact
        if: matrix.primary == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: just-bashit
          path: just-bashit.tar.gz

  test-macos:
    name: test (macos)
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: brew install bash coreutils diffutils bats-core

      - name: Export GNU utilities to PATH
        run: |
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run tests
        run: make test

  test-windows:
    name: test (windows/ucrt64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git make diffutils curl openssh

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run tests
        run: make test

  coverage:
    name: coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: kcov/kcov:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            ca-certificates make git bats curl openssh-client

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run tests with coverage
        run: make coverage

      - name: Generate coverage badge JSON
        run: |
          XML=$(find test-results/coverage -name cobertura.xml | head -1)
          RATE=$(grep -oP 'line-rate="\K[^"]+' "${XML}" | head -1)
          PCT=$(awk "BEGIN { printf \"%d\", ${RATE} * 100 }")
          if   [ "${PCT}" -ge 90 ]; then COLOR="brightgreen"
          elif [ "${PCT}" -ge 75 ]; then COLOR="green"
          elif [ "${PCT}" -ge 60 ]; then COLOR="yellowgreen"
          elif [ "${PCT}" -ge 40 ]; then COLOR="yellow"
          else COLOR="red"
          fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%d%%","color":"%s"}\n' \
            "${PCT}" "${COLOR}" > test-results/coverage/coverage-badge.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: test-results/coverage/

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      # The gate. Everything it runs — the standard.mk drift check, help and
      # ghost gates, shellcheck, shfmt, mdformat — is defined in the Makefile
      # and the hook config, so local and CI cannot disagree.
      - name: make lint
        run: make lint

      - name: shellcheck (SARIF → Code Scanning)
        run: |
          shellcheck --format=sarif src/just_bashit/*.sh > shellcheck.sarif || true
          python3 -c "import json; json.load(open('shellcheck.sarif'))" \
            2>/dev/null || printf '%s\n' \
            '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"shellcheck","rules":[]}},"results":[]}]}' \
            > shellcheck.sarif

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: shellcheck.sarif

  ci-passed:
    name: CI passed
    needs: [test, test-macos, test-windows, lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required job failed or was cancelled"; exit 1
          fi
          echo "All required jobs passed"

  deploy-docs:
    needs: [coverage, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install zensical junit2html junitparser

      - run: zensical build --clean

      - name: Download test report XML
        uses: actions/download-artifact@v8
        with:
          name: test-report-xml
          path: test-report-xml

      - name: Generate test report HTML
        run: |
          python3 - <<'PYEOF'
          import glob
          from junitparser import JUnitXml
          xml = JUnitXml()
          for f in sorted(glob.glob('test-report-xml/*.xml')):
              xml += JUnitXml.fromfile(f)
          xml.write('test-report-xml/merged.xml')
          PYEOF
          mkdir -p site/test-report
          junit2html test-report-xml/merged.xml site/test-report/index.html

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: site/coverage

      - name: Move badge JSON to site root
        run: mv site/coverage/coverage-badge.json site/coverage-badge.json || true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deployment
